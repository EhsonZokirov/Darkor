  <meta name="theme-color" content="#07070a" />
  <script>
    // Выбираем тему до отрисовки страницы, чтобы не было мигания
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("darkor_theme");
        if (saved === "light" || saved === "dark") theme = saved;
        else if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
      if (theme === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f6f5f2");
    })();
  </script>
